name: Publish reviewed AWS keeper image
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Require successful main CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml
          --branch main --commit "$GITHUB_SHA" --event push
          --json status,conclusion |
          jq -e 'any(.[]; .status == "completed" and .conclusion == "success")'
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DUSK_AWS_IMAGE_PUBLISHER_ROLE }}
          aws-region: ap-southeast-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Publish the native image without changing keeper mode
        env:
          REPOSITORY: ${{ vars.DUSK_ECR_KEEPER_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[0-9]{12}\.dkr\.ecr\.ap-southeast-1\.amazonaws\.com/[a-z0-9/_-]+$ ]]
          docker buildx build --platform linux/amd64 --file deploy/railway/rust.Dockerfile \
            --tag "$REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance=true --sbom=true --push --metadata-file keeper-image.json .
          digest=$(jq -r '.["containerimage.digest"]' keeper-image.json)
          # shellcheck disable=SC2016
          printf 'keeper: `%s@%s`\n\nImage publication does not authorize live execution or freeze the protocol lock.\n' "$REPOSITORY" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aws-keeper-image-${{ github.sha }}
          path: keeper-image.json
