name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_release:
        description: Require a frozen protocol lock
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/validate-repo.mjs
      - name: Human-readable local terminal output
        run: python3 -m unittest discover -s scripts -p 'test_keeper_console.py' -v
      - run: npm ci
      - run: cargo build --locked
      - run: npm run typecheck
      - run: npm test
      - run: npm run keeper:ts:check

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keeper_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: keeper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keeper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Durable submission and restart recovery
        env:
          KEEPER_TEST_DATABASE_URL: postgresql://keeper_test:disposable_ci_only@127.0.0.1:5432/keeper_test
        run: cargo test --locked -p dusk-keeper -- --ignored

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file deploy/railway/rust.Dockerfile --tag dusk-keeper-rs:test .
      - run: docker build --file deploy/railway/typescript.Dockerfile --tag dusk-keeper-ts:test .
      - name: Verify the packaged mainnet artifacts offline
        run: |
          docker run --rm --network none --env KEEPER_MODE=shadow dusk-keeper-rs:test --check
          docker run --rm --network none --entrypoint sh dusk-keeper-rs:test -c 'test -f /app/protocol/mainnet-deployment.v1.json && sha256sum /app/artifacts/dusk.so /app/artifacts/leverage_delegate.so /app/artifacts/dusk.json /app/artifacts/leverage_delegate.json /app/artifacts/dusk-sdk.tgz' > image.sha256
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const lock=JSON.parse(fs.readFileSync('protocol.lock.json'));
          const hashes=new Map(fs.readFileSync('image.sha256','utf8').trim().split('\n').map(line=>line.trim().split(/\s+/).reverse()));
          for(const artifact of [...lock.programs.flatMap(p=>[p.binary,p.idl]),lock.sdk])
            assert.equal(hashes.get('/app/'+artifact.path),artifact.sha256,'runtime image artifact mismatch');
          JS

  live-release-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.live_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require immutable protocol artifacts
        env:
          REQUIRE_FROZEN_PROTOCOL: "1"
        run: node scripts/validate-repo.mjs
