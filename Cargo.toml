[workspace]
members = [
  "rust/crates/dusk-adapter",
  "rust/crates/keeper-core",
  "rust/apps/keeper",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
bs58 = "=0.5.1"
# Minimal TLS-capable HTTP client for RPC. Pinned like everything else here:
# a keeper's dependency set is part of its attack surface, so versions do not
# float.
ureq = { version = "=2.12.1", default-features = false, features = ["json", "tls"] }
borsh = { version = "=1.5.7", features = ["derive"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc"] }
dusk-adapter = { path = "rust/crates/dusk-adapter" }
keeper-core = { path = "rust/crates/keeper-core" }
